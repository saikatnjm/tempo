name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install gjs and the schema compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gjs libglib2.0-bin zip
      - name: Unit tests
        run: make test
      - name: Build both variants
        run: make zip
      - uses: actions/upload-artifact@v4
        with:
          name: tempo-zips
          path: dist/*.zip

  smoke:
    name: GNOME ${{ matrix.gnome }} (${{ matrix.base }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {gnome: "42", base: "ubuntu:22.04", dockerfile: Dockerfile.apt}
          - {gnome: "43", base: "debian:12", dockerfile: Dockerfile.apt}
          - {gnome: "46", base: "ubuntu:24.04", dockerfile: Dockerfile.apt}
          - {gnome: "48", base: "debian:13", dockerfile: Dockerfile.apt}
          - {gnome: "49", base: "fedora:43", dockerfile: Dockerfile.dnf}
          - {gnome: "50", base: "ubuntu:26.04", dockerfile: Dockerfile.apt}
          - {gnome: "51", base: "fedora:45", dockerfile: Dockerfile.dnf}
    steps:
      - uses: actions/checkout@v4
      - name: Build a container with this GNOME Shell
        run: >
          docker build -t tempo-test
          -f tests/smoke/${{ matrix.dockerfile }}
          --build-arg BASE=${{ matrix.base }}
          tests/smoke
      - name: Load Tempo in a headless GNOME Shell and exercise every feature
        run: tests/smoke/in-container.sh tempo-test build/smoke
      - name: Show what failed
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os
          out = 'build/smoke'
          report = os.path.join(out, 'report.json')
          if os.path.exists(report):
              r = json.load(open(report))
              failed = [c for c in r['checks'] if not c['ok']]
              notes = r.get('notes', {})
              print(f"::notice title=GNOME Shell {r['shell']}::{len(r['checks']) - len(failed)} of {len(r['checks'])} checks passed; "
                    f"sound tested: {r.get('audio')}; menu bottom: {notes.get('menuBottom')}")
              for c in failed:
                  print(f"::error title=Failed check::{c['name']} ({c['detail'][:300]})")
          else:
              print('::error title=Smoke test::no report: the shell or the probe did not get far enough')
          for name in ('errors.txt', 'shell.log'):
              path = os.path.join(out, name)
              if not os.path.exists(path):
                  continue
              lines = [l.strip() for l in open(path, errors='replace') if name == 'errors.txt' or 'JS ERROR' in l or 'rror:' in l or 'crashed' in l or 'exit status' in l]
              for line in lines[:6]:
                  print(f"::warning title={name}::{line[:300]}")
              if name == 'errors.txt' and lines:
                  break
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-gnome-${{ matrix.gnome }}
          path: build/smoke
