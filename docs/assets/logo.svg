<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Tempo logo">
  <title>Tempo</title>
  <defs>
    <linearGradient id="ember" x1="0.85" y1="1" x2="0.15" y2="0">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.5" stop-color="#ff9f43"/>
      <stop offset="1" stop-color="#ff5e7e"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="58" fill="#1c1c1e"/>
  <!-- ring gauge, about 70 % full -->
  <circle cx="128" cy="128" r="84" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="20"/>
  <circle cx="128" cy="128" r="84" fill="none" stroke="url(#ember)" stroke-width="20" stroke-linecap="round"
          stroke-dasharray="369.5 527.8" transform="rotate(-90 128 128)"/>
  <!-- three music bars -->
  <rect x="92" y="108" width="16" height="40" rx="8" fill="#ffd166"/>
  <rect x="120" y="88" width="16" height="80" rx="8" fill="#ff9f43"/>
  <rect x="148" y="100" width="16" height="56" rx="8" fill="#ff5e7e"/>
</svg>
